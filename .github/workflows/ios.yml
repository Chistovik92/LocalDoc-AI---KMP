name: iOS Build

on:
  push:
    branches: [ main, master, release-* ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег релиза, в который нужно загрузить iOS-файлы (например v1.1.0)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  compile:
    name: Компиляция Kotlin/Native (быстрая проверка)
    runs-on: macos-15
    steps:
      - name: Checkout (с сабмодулем llama.cpp)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Xcode 26 (SDK iOS 26 нужен Compose Multiplatform 1.11)
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android NDK с повторами (Gradle конфигурирует Android-часть даже для iOS-задач)
        run: |
          NDK_VERSION=$(grep -o 'ndk;[0-9.]*' engineAndroid/build.gradle.kts | head -1)
          [ -n "$NDK_VERSION" ] || NDK_VERSION="ndk;27.0.12077973"
          SDKM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          for i in 1 2 3 4; do
            yes | "$SDKM" --install "$NDK_VERSION" && break
            echo "Попытка $i не удалась, повтор…"; sleep 10
          done

      - name: Компиляция common + iOS Kotlin (cinterop + компиляция)
        run: ./gradlew :shared:compileKotlinIosSimulatorArm64 --stacktrace

  build:
    name: Сборка iOS (xcframework + приложение)
    runs-on: macos-15
    env:
      RELEASE_TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}
    steps:
      - name: Checkout (с сабмодулем llama.cpp)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          submodules: recursive

      - name: Xcode 26 (SDK iOS 26 нужен Compose Multiplatform 1.11)
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android NDK с повторами (Gradle конфигурирует Android-часть даже для iOS-задач)
        run: |
          NDK_VERSION=$(grep -o 'ndk;[0-9.]*' engineAndroid/build.gradle.kts | head -1)
          [ -n "$NDK_VERSION" ] || NDK_VERSION="ndk;27.0.12077973"
          SDKM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          for i in 1 2 3 4; do
            yes | "$SDKM" --install "$NDK_VERSION" && break
            echo "Попытка $i не удалась, повтор…"; sleep 10
          done

      - name: Сборка C-ядра (llama.cpp + Metal) в XCFramework
        run: |
          chmod +x cpp_core/scripts/build_ios_xcframework.sh
          ./cpp_core/scripts/build_ios_xcframework.sh

      - name: sherpa-onnx для iOS (офлайн-голоса Piper)
        run: |
          chmod +x cpp_core/scripts/fetch_sherpa_onnx_ios.sh
          ./cpp_core/scripts/fetch_sherpa_onnx_ios.sh

      - name: ONNX Runtime для iOS (семантический поиск)
        run: |
          chmod +x cpp_core/scripts/fetch_onnxruntime_ios.sh
          ./cpp_core/scripts/fetch_onnxruntime_ios.sh

      - name: Загрузка xcframework (артефакт)
        uses: actions/upload-artifact@v4
        with:
          name: localdoc-core-xcframework
          path: cpp_core/build-ios/localdoc_core.xcframework

      - name: Компиляция Kotlin/Native фреймворка (симулятор)
        run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64 --stacktrace

      - name: XcodeGen и сборка приложения (симулятор, без подписи)
        run: |
          brew install xcodegen
          cd iosApp
          xcodegen generate
          xcodebuild -project LocalDocAI.xcodeproj \
            -scheme LocalDocAI \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath build/sim \
            CODE_SIGNING_ALLOWED=NO build

      - name: UI device-тест в симуляторе
        run: |
          # Выбираем iPhone на новейшем iOS-runtime. Простой `next(isAvailable)` брал первым
          # симулятор Apple Vision Pro (visionOS), который xcodebuild не принимает для iOS-схемы.
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          def ver(runtime):
              parts = runtime.replace("-", ".").split(".")
              nums = [int(p) for p in parts if p.isdigit()]
              return tuple(nums) if nums else (0,)
          picks = []
          for runtime, devs in data["devices"].items():
              if "iOS" not in runtime:
                  continue
              for d in devs:
                  if d.get("isAvailable") and "iPhone" in d.get("name", ""):
                      picks.append((ver(runtime), d["udid"], d["name"]))
          if not picks:  # запасной вариант: любой iOS-девайс (iPad)
              for runtime, devs in data["devices"].items():
                  if "iOS" not in runtime:
                      continue
                  for d in devs:
                      if d.get("isAvailable"):
                          picks.append((ver(runtime), d["udid"], d["name"]))
          picks.sort(reverse=True)
          print(picks[0][1] if picks else "")
          ')
          [ -n "$UDID" ] || { echo "Нет доступного iOS-симулятора"; exit 1; }
          echo "Выбран симулятор: $UDID"
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b
          xcodebuild -project iosApp/LocalDocAI.xcodeproj \
            -scheme LocalDocAI \
            -destination "platform=iOS Simulator,id=$UDID" \
            -configuration Debug \
            -derivedDataPath iosApp/build/sim \
            -resultBundlePath iosApp/build/uitests.xcresult \
            CODE_SIGNING_ALLOWED=NO test

      - name: Результаты UI-теста
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ui-test-results
          path: iosApp/build/uitests.xcresult
          if-no-files-found: ignore

      - name: Сборка приложения для устройства (arm64, без подписи)
        run: |
          # Без параллельных задач: пик памяти компилятора Kotlin/Native (оптимизация release) на 7-ГБ раннере иначе даёт OutOfMemoryError
          ./gradlew :shared:linkReleaseFrameworkIosArm64 --no-parallel --stacktrace
          cd iosApp
          xcodegen generate
          xcodebuild -project LocalDocAI.xcodeproj \
            -scheme LocalDocAIDevice \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO build

      - name: Упаковка iOS-файлов для релиза
        run: |
          VERSION="${RELEASE_TAG:-dev}"
          mkdir -p dist
          # Неподписанный .ipa: переподписывается своим Apple ID (AltStore, Sideloadly, Xcode)
          APP=$(find iosApp/build/device/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          mkdir -p ipa/Payload && cp -R "$APP" ipa/Payload/
          (cd ipa && zip -qry "../dist/LocalDocAI-${VERSION}-unsigned.ipa" Payload)
          # Приложение для симулятора iOS (Apple Silicon)
          SIM=$(find iosApp/build/sim/Build/Products/Debug-iphonesimulator -maxdepth 1 -name "*.app" | head -1)
          (cd "$(dirname "$SIM")" && zip -qry "$GITHUB_WORKSPACE/dist/LocalDocAI-${VERSION}-simulator.app.zip" "$(basename "$SIM")")
          # C-ядро llama.cpp + Metal
          (cd cpp_core/build-ios && zip -qry "$GITHUB_WORKSPACE/dist/localdoc_core-${VERSION}.xcframework.zip" localdoc_core.xcframework)
          ls -lh dist

      - name: Загрузка iOS-файлов (артефакт)
        uses: actions/upload-artifact@v4
        with:
          name: localdoc-ios-release-files
          path: dist/*

      - name: Публикация iOS-файлов в GitHub Release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --title "LocalDoc AI $RELEASE_TAG" \
              --notes-file .github/release-notes.md || true
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber

      - name: Загрузка Kotlin-фреймворка (артефакт)
        uses: actions/upload-artifact@v4
        with:
          name: composeapp-ios-sim-framework
          path: shared/build/bin/iosSimulatorArm64/debugFramework/ComposeApp.framework
