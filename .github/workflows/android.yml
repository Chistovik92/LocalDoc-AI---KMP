name: Android Build

on:
  push:
    branches: [ main, master ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Сборка Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (с сабмодулем llama.cpp)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Валидация Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Настройка Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Сборка debug-APK
        run: ./gradlew :composeApp:assembleDebug --stacktrace

      - name: Сборка release-APK (подпись CI-ключом)
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./gradlew :composeApp:assembleRelease --stacktrace

      - name: Загрузка debug-APK (артефакт)
        uses: actions/upload-artifact@v4
        with:
          name: localdoc-ai-debug
          path: composeApp/build/outputs/apk/debug/*.apk

      - name: Загрузка release-APK (артефакт)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: localdoc-ai-release
          path: composeApp/build/outputs/apk/release/*.apk

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "LocalDoc AI ${GITHUB_REF_NAME}" \
            --notes "Автоматическая сборка. APK подписан CI-ключом (test signing). Установите и скачайте модель в приложении." \
            composeApp/build/outputs/apk/release/*.apk || \
          gh release upload "${GITHUB_REF_NAME}" composeApp/build/outputs/apk/release/*.apk --clobber
