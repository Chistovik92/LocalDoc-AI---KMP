name: Android Build

on:
  push:
    branches: [ main, master ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Сборка Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout (с сабмодулем llama.cpp)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Валидация Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Настройка Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit-тесты (commonTest на JVM)
        run: ./gradlew :composeApp:testDebugUnitTest --stacktrace

      - name: Сборка debug-APK
        run: ./gradlew :composeApp:assembleDebug --stacktrace

      - name: Подготовка постоянного ключа подписи
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Секрет ANDROID_KEYSTORE_BASE64 не задан — релиз без постоянной подписи запрещён"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/localdoc-release.p12"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/localdoc-release.p12" >> "$GITHUB_ENV"

      - name: Сборка release-APK (постоянный ключ)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew :composeApp:assembleRelease --stacktrace
          APK=$(ls composeApp/build/outputs/apk/release/*.apk | grep -v unsigned | head -1)
          [ -n "$APK" ] || { echo "::error::Подписанный release-APK не найден"; exit 1; }
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | head -5

      - name: Загрузка debug-APK (артефакт)
        uses: actions/upload-artifact@v4
        with:
          name: localdoc-ai-debug
          path: composeApp/build/outputs/apk/debug/*.apk

      - name: Загрузка release-APK (артефакт)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: localdoc-ai-release
          path: composeApp/build/outputs/apk/release/*.apk

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "LocalDoc AI ${GITHUB_REF_NAME}" \
            --notes-file .github/release-notes.md \
            composeApp/build/outputs/apk/release/*.apk || \
          gh release upload "${GITHUB_REF_NAME}" composeApp/build/outputs/apk/release/*.apk --clobber
