name: LocalDocAI

options:
  bundleIdPrefix: com.localdoc
  deploymentTarget:
    iOS: "16.0"

settings:
  base:
    MARKETING_VERSION: 1.1.0
    CURRENT_PROJECT_VERSION: 3
    SWIFT_VERSION: "5.9"
    LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    # Статическое C++-ядро llama.cpp (Metal + Accelerate) линкуется в приложение напрямую
    OTHER_LDFLAGS: "$(inherited) -lc++"

targets:
  # Запуск на симуляторе (Apple Silicon) и локальная разработка
  LocalDocAI:
    type: application
    platform: iOS
    sources:
      - path: iosApp
    dependencies:
      - framework:
          path: ../composeApp/build/bin/iosSimulatorArm64/debugFramework/ComposeApp.framework
          embed: false
      - framework:
          path: ../cpp_core/build-ios/localdoc_core.xcframework
          embed: false
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: Accelerate.framework
    settings:
      base:
        INFOPLIST_FILE: iosApp/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.localdoc.ai
        CODE_SIGN_STYLE: Automatic

  # Сборка .ipa для физических устройств
  LocalDocAIDevice:
    type: application
    platform: iOS
    sources:
      - path: iosApp
    dependencies:
      - framework:
          path: ../composeApp/build/bin/iosArm64/releaseFramework/ComposeApp.framework
          embed: false
      - framework:
          path: ../cpp_core/build-ios/localdoc_core.xcframework
          embed: false
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: Accelerate.framework
    settings:
      base:
        INFOPLIST_FILE: iosApp/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.localdoc.ai
        CODE_SIGN_STYLE: Automatic

schemes:
  LocalDocAI:
    build:
      targets:
        LocalDocAI: all
    run:
      config: Debug
  LocalDocAIDevice:
    build:
      targets:
        LocalDocAIDevice: all
    archive:
      config: Release
