name: LocalDocAI

options:
  bundleIdPrefix: com.localdoc
  deploymentTarget:
    iOS: "16.0"

settings:
  base:
    MARKETING_VERSION: 1.9.0
    CURRENT_PROJECT_VERSION: 11
    SWIFT_VERSION: "5.9"
    LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    # Статическое C++-ядро llama.cpp (Metal + Accelerate) линкуется в приложение напрямую
    OTHER_LDFLAGS: "$(inherited) -lc++ -lbz2"
    # Kotlin-фреймворк и C-ядро собираются только под arm64 (симулятор Apple Silicon)
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64

targets:
  # Запуск на симуляторе (Apple Silicon) и локальная разработка
  LocalDocAI:
    type: application
    platform: iOS
    sources:
      - path: iosApp
    dependencies:
      - framework: ../composeApp/build/bin/iosSimulatorArm64/debugFramework/ComposeApp.framework
        embed: false
      - framework: ../cpp_core/build-ios/localdoc_core.xcframework
        embed: false
      # Офлайн-синтез Piper (sherpa-onnx): динамический, встраивается в приложение
      - framework: ../cpp_core/build-ios/SherpaOnnxC.xcframework
        embed: true
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: Accelerate.framework
      - sdk: MediaPlayer.framework
      - sdk: Speech.framework
      - target: LocalDocWidget
        embed: true
        codeSign: false
    settings:
      base:
        INFOPLIST_FILE: iosApp/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.localdoc.ai
        CODE_SIGN_STYLE: Automatic

  # Сборка .ipa для физических устройств
  LocalDocAIDevice:
    type: application
    platform: iOS
    sources:
      - path: iosApp
    dependencies:
      - framework: ../composeApp/build/bin/iosArm64/releaseFramework/ComposeApp.framework
        embed: false
      - framework: ../cpp_core/build-ios/localdoc_core.xcframework
        embed: false
      # Офлайн-синтез Piper (sherpa-onnx): динамический, встраивается в приложение
      - framework: ../cpp_core/build-ios/SherpaOnnxC.xcframework
        embed: true
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: Accelerate.framework
      - sdk: MediaPlayer.framework
      - sdk: Speech.framework
      - target: LocalDocWidget
        embed: true
        codeSign: false
    settings:
      base:
        INFOPLIST_FILE: iosApp/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.localdoc.ai
        CODE_SIGN_STYLE: Automatic

  # Виджет рабочего стола (WidgetKit): «Слушать», «Книга», «Ссылка» через localdoc://
  LocalDocWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: iosWidget
      # Интенты виджета должны быть известны и приложению: AudioPlaybackIntent выполняется в его процессе
      - path: iosApp/iosApp/PlayerIntents.swift
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: AppIntents.framework
    settings:
      base:
        INFOPLIST_FILE: iosWidget/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.localdoc.ai.widget
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES

schemes:
  LocalDocAI:
    build:
      targets:
        LocalDocAI: all
    run:
      config: Debug
  LocalDocAIDevice:
    build:
      targets:
        LocalDocAIDevice: all
    archive:
      config: Release
