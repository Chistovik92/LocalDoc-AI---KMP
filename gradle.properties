org.gradle.jvmargs=-Xmx6144M -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
kotlin.mpp.sourceHierarchyCustom= true
kotlin.native.ignoreDisabledTargets=true
# Компилятор Kotlin/Native работает в отдельном процессе (по умолчанию 3 ГБ); оптимизация release-фреймворка (DevirtualizationAnalysis)
# на этом объёме падала с OutOfMemoryError (iOS Build по тегу v2.0.2)
kotlin.native.jvmArgs=-Xmx5g
android.suppressUnsupportedCompileSdk=36,37
